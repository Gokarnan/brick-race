/* data */

const LN=['Brick Basics','Plus Gates','Plus & Minus','Gate Choices','Wide Waters','Crab Patrol','Island Hops','Risky Gates','Turbo Bots','Championship'];

const TVKG='linear-gradient(#c8102e 0 28%,#ffd200 28% 72%,#c8102e 72%)';
function bk(x,y,w,h,col){if(col=='tvk'){c.fillStyle='#c8102e';c.fillRect(x,y,w,h);c.fillStyle='#ffd200';c.fillRect(x,y+h*.28,w,h*.44)}else{c.fillStyle=col;c.fillRect(x,y,w,h)}}
function bfill(id,col,i,t){switch(id){case'b1':return'#1d4ed8';case'b2':return'#39ff14';case'b3':return`hsl(${(i*47+t*120)%360},90%,55%)`;case'b4':return'#ffcf26';case'b5':return'#5b2fc4';case'b6':return'#a5f3ff';case'b7':return'tvk'}return col}
const cfill=(c,t)=>c=='rb'?`hsl(${t*200%360},90%,60%)`:c=='gx'?'#4b2a8a':c;
/* level generation */
function gen(n){let s=n*7919;const rnd=()=>(s=(s*16807+11)%2147483647)/2147483647;
const bo=n%10==0,R=bo?2:n>=30?5:4,ng=Math.min(7,3+((n-1)/8|0)),gb=Math.min(50,25+Math.round((n-1)*.9));
const L={n,R,storm:STORM.includes(n),boss:bo?{...BS[n/10-1],k:n/10}:null,pl:[],gp:[],bk:[],ga:[],ob:[],dc:[]};let y=0,id=0;
for(let k=0;k<=ng;k++){const len=k==ng?240:k?460:500,p={y0:y,y1:y+len};L.pl.push(p);y+=len;
 for(let d=p.y0+40;d<p.y1;d+=110)L.dc.push({x:rnd()<.5?14:346,y:d,e:'🌴'});
 if(k==ng)break;
 const per=Math.round(gb*(n<2?1.3:n<5?.9:.75))+3;
 for(let o=0;o<R;o++)for(let j=0;j<per;j++)L.bk.push({x:50+rnd()*260,y:p.y0+40+rnd()*(len-90),o});
 const rc=n<2?0:Math.min(3,1+(n>>2)),gc=n<4?2:3,w=288/gc,P=[5,10,15,20,25],M=[3,5,8,10,15];
 for(let j=0;j<rc;j++){const ry=p.y0+110+(j+.5)*((len-190)/rc),list=[],lim=Math.min(5,1+(n>>1)),pp=n>=25?.35:n>=8?.45:.6,fp=n<4?99:(rnd()*gc|0);
  for(let q=0;q<gc;q++){let v;if(n<3||q==fp&&n>=4||(n==3&&q==0))v=P[rnd()*lim|0];else v=rnd()<pp?P[rnd()*lim|0]:-M[Math.min(4,(rnd()*(lim+(n>=8?1:0)))|0)];if(n==3&&q==1)v=-M[rnd()*3|0];list.push({x:36+q*w+w/2,w:w-8,v})}
  if(n>=3&&rnd()<.22){const q=n==3?1:(rnd()*gc|0);if(q!=fp){const k=rnd()<.6?'x':'d';list[q].k=k;list[q].v=k=='x'?[2,3,4][Math.min(2,(rnd()*(n>>1))|0)]:[2,2,3][rnd()*3|0]}}
  L.ga.push({id:id++,y:ry,pi:k,list})}
 if(n>=6)for(let j=0;j<Math.min(3+(n/15|0),n-5);j++)L.ob.push({y:p.y0+120+rnd()*(len-200),sp:1+rnd(),ph:rnd()*6,amp:90+rnd()*40});
 const g={y0:y,y1:y+gb*U,gb};L.gp.push(g);y=g.y1;L.dc.push({x:rnd()<.5?14:346,y:(g.y0+g.y1)/2,e:'🏝️'})}
L.fy=L.pl[ng].y0+110;return L}
const gv=(q,b)=>q.k=='x'?b*q.v:q.k=='d'?Math.floor(b/q.v):b+q.v,gl=q=>q.k=='x'?'×'+q.v:q.k=='d'?'÷'+q.v:(q.v>0?'+':'−')+Math.abs(q.v),gcol=q=>q.k=='x'?'#f59e0b':q.k=='d'?'#be123c':q.v>0?'#22c55e':'#ef4444';
const LX=l=>180+(l-(L.R-1)/2)*54;
/* state */
let CL=COL.slice(),L,RS,P,T=0,st='menu',cam=0,cd=0,fin=0,fls=[],pts=[],jv={x:0,y:0},kx=0,ky=0,last=0;
const cv=$('#cv'),c=cv.getContext('2d');cv.width=W;cv.height=H;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}addEventListener('resize',fit);fit();
const sy=y=>470-(y-cam);
function play(n,sk){if(n%10==0&&!sk){bossIntro(n);return}snd('click');L=gen(n);CL=COL.slice();if(L.boss)CL[1]=L.boss.col;if(L.storm){L.sm={tl:4,ts:9,TN:null,st:[],LF:0,ev:[{p:0,t:7},{p:.82},...(Math.random()<.35?[{p:.4+Math.random()*.2}]:[])]};SV.sv[n]=1;save()}RS=[];fin=0;T=0;fls=[];pts=[];
for(let i=0;i<L.R;i++){const lane=i==0?1:i==1?0:i;RS.push({i,P:!i,lane,x:LX(lane),y:30,b:0,br:L.gp.map(()=>0),used:{},gi:0,mode:'g',batch:(L.boss?10+L.boss.k*2:6)+(Math.random()*3|0),cd:0,hit:0,dash:0,dcd:0,coll:0,gates:0,bl:0,fin:0,ft:0,t:Math.random()*9,tu:0,mv:0,stun:0,burn:0,tc:0,lift:0,lz:0,ld:0,pm:0,pd:i?0:(SV.pa&&SV.pa.pd?1:0),ps:0,pc:0,pk:0,pb:0,q:0,qt:0,spd:i?(L.boss?94+L.boss.k*3:92+Math.min(n,30)*.3+Math.random()*4):118})}
P=RS[0];cam=30;cd=2.4;st='count';$('#ui').className='scr';$('#hud').style.display='flex';$('#bb').style.display=L.boss?'block':'none';pas='';$('#pup').classList.remove('on');$('#bbn').textContent=L.boss?L.boss.e+' '+L.boss.n:'';$('#joy').style.display=$('#dash').style.display='block';applyCtl()}
const gapAt=y=>L.gp.findIndex(g=>y>g.y0-8&&y<g.y1);
const dir=(r,x,y)=>{const dx=x-r.x,dy=y-r.y,d=Math.hypot(dx,dy);return d<4?[0,0]:[dx/d,dy/d]};
function nb(r,pl){let b=null,bd=1e9;for(const k of L.bk)if(!k.d&&k.o==r.i&&k.y>pl.y0&&k.y<pl.y1){const d=(k.x-r.x)**2+(k.y-r.y)**2;if(d<bd){bd=d;b=k}}return b}
function ai(r){const gp=L.gp[r.gi];if(!gp)return[Math.max(-1,Math.min(1,(LX(r.lane)-r.x)/30)),1];
const full=gp.gb*U,need=Math.ceil((full-r.br[r.gi])/U);
if(r.b==0&&r.br[r.gi]<full&&r.y>gp.y0-14&&r.mode!='g'){r.mode='g';r.batch=(L.boss?10+L.boss.k*2:6)+(Math.random()*3|0)}
if(r.mode=='g'){if(r.y>gp.y0-10)return[0,-1];const k=nb(r,L.pl[r.gi]);if(r.b>=Math.min(need,r.batch)||!k){r.mode='go';return[0,0]}return dir(r,k.x,k.y)}
const rows=L.ga.filter(g=>g.pi==r.gi&&!r.used[g.id]&&g.y>r.y-8);
if(rows.length){const row=rows[0];let best=null,bs=-1e9;for(const g of row.list){const e=gv(g,Math.max(r.b,8))-Math.max(r.b,8),s=e+(e>0?15:0)+Math.sin(r.i*7+row.id*3)*14*(1-Math.min(1,r.spd/130));if(s>bs){bs=s;best=g}}return dir(r,best.x,row.y+16)}
return[Math.max(-1,Math.min(1,(LX(r.lane)-r.x)/30)),1]}
function topup(r){const gp=L.gp[r.gi];if(!gp)return;const need=Math.ceil((gp.gb*U-r.br[r.gi])/U),pl=L.pl[r.gi];if(r.b>=need||L.bk.some(k=>!k.d&&k.o==r.i&&k.y>pl.y0&&k.y<pl.y1))return;for(let j=0;j<Math.min(need-r.b,8);j++)L.bk.push({x:50+Math.random()*260,y:pl.y0+40+Math.random()*(pl.y1-pl.y0-90),o:r.i})}
function spark(x,y,col,n=4,v=60){for(let i=0;i<n;i++)pts.push({x,y,vx:(Math.random()-.5)*v*2,vy:Math.random()*v+20,t:0,col,g:-200})}
function ftxt(r,v,tx){fls.push({x:r.x,y:r.y+20,t:0,txt:tx||(v>0?'+':'−')+Math.abs(v),col:v>0?'#7dff6b':'#ff6b6b'})}
function step(r,dt){if(r.fin)return;if(r.P)pstep(r,dt);if(r.lift>0)return;let ix=0,iy=0;if(r.P){ix=jv.x||kx;iy=jv.y||ky}else[ix,iy]=ai(r);if(r.stun>0){r.stun-=dt;ix=iy=0}
const mv=Math.hypot(ix,iy);if(mv>1){ix/=mv;iy/=mv}r.mv=mv>.1;r.hit-=dt;r.cd-=dt;r.dash-=dt;r.dcd-=dt;r.tu-=dt;
const sp=r.spd*(r.dash>0?1.7:r.P&&r.ps>0?1.4:1)*(r.hit>0?.65:1);let nx=r.x+ix*sp*dt,ny=Math.max(0,r.y+iy*sp*dt);
const gi=gapAt(ny);
if(gi>=0){const g=L.gp[gi];nx+=(LX(r.lane)-nx)*Math.min(1,dt*12);
 if(iy>.1&&r.b>0&&r.cd<=0&&r.br[gi]<g.gb*U&&ny>=g.y0+r.br[gi]-4){r.br[gi]+=U;r.b--;r.bl++;r.cd=.09;if(r.P)snd('build');spark(LX(r.lane),g.y0+r.br[gi],CL[r.i],3,40)}
 if(ny>g.y0)ny=Math.min(ny,g.y0+r.br[gi])}else nx=Math.max(42,Math.min(318,nx));
r.x=nx;r.y=ny;if(r.mv)r.t+=dt;while(L.gp[r.gi]&&r.y>L.gp[r.gi].y1)r.gi++;

 else if(q.bp&&q.t<1.25){c.strokeStyle='#fff';c.lineWidth=4;c.shadowColor='#9fd0ff';c.shadowBlur=14;c.beginPath();c.moveTo(q.x+q.bp[0],-10);for(let i=1;i<7;i++)c.lineTo(q.x+q.bp[i],-10+(Y+10)*i/7);c.lineTo(q.x,Y);c.stroke();c.shadowBlur=0}}
const N=S.TN;if(N){const a=Math.min(1,N.life/2,N.age/1.2),X0=N.x,Y0=sy(N.y);c.globalAlpha=a*.6;for(let i=0;i<10;i++){const w=10+i*8,xo=Math.sin(T*7+i*.8)*(4+i);c.fillStyle=i%2?'#c9ced8':'#a9b0bd';c.beginPath();c.ellipse(X0+xo,Y0-i*13,w,7,0,0,7);c.fill()}
 c.globalAlpha=a;c.font='14px serif';for(let i=0;i<6;i++){const an=T*6+i*1.05;c.fillText(i%2?'🧱':'🍃',X0+Math.cos(an)*(30+i*5),Y0-20-i*12+Math.sin(an)*6)}c.globalAlpha=1}
c.lineCap='round';c.strokeStyle='rgba(190,215,245,.25)';c.lineWidth=1;c.beginPath();for(let i=0;i<60;i++){const x=(i*61+T*90)%400-20,y=(i*113+T*520)%680-20;c.moveTo(x,y);c.lineTo(x-3,y+10)}c.stroke();
c.strokeStyle='rgba(220,238,255,.55)';c.lineWidth=2;c.beginPath();for(let i=0;i<38;i++){const x=(i*97+T*150)%410-30,y=(i*149+T*860)%690-30;c.moveTo(x,y);c.lineTo(x-7,y+22)}c.stroke();
c.lineWidth=1.5;for(let i=0;i<16;i++){const p=(T*1.5+i*.37)%1,x=(i*83+37)%330+15,y=(i*151)%520+90;c.strokeStyle=`rgba(225,242,255,${(1-p)*.55})`;c.beginPath();c.ellipse(x,y,3+p*14,1.5+p*6,0,0,7);c.stroke()}
if(S.LF>0){c.fillStyle=`rgba(255,255,255,${S.LF*.65})`;c.fillRect(0,0,W,H)}}
/* power-ups */
const PUP={mag:{n:'Brick Magnet',e:'🧲',p:50,d:'Pulls nearby bricks into your stack for 10 seconds.'},dbl:{n:'Double Bricks',e:'💎',p:60,d:'Equip: bricks ×2, + gates ×2, − gates halved for the whole race.'},spd:{n:'Speed Boost',e:'💨',p:40,d:'+40% speed for 5 seconds. 30s cooldown.'},shd:{n:'Brick Shield',e:'🛡️',p:50,d:'Blocks one − or ÷ gate penalty. Lasts 15s or 1 hit.'},brg:{n:'Instant Bridge',e:'🌉',p:70,d:'Spends 20 bricks to instantly build 20 bridge segments at a gap.'}};
let tmo,pas='';function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tmo);tmo=setTimeout(()=>t.style.display='none',1800)}
function pstep(r,dt){if(r.pm>0&&(r.pm-=dt)<=0){r.pm=0;snd('off')}if(r.ps>0&&(r.ps-=dt)<=0){r.ps=0;snd('off')}if(r.pk>0&&(r.pk-=dt)<=0){r.pk=0;snd('off')}r.pc-=dt;r.pb-=dt;
if(r.pm>0)for(const k of L.bk)if(!k.d&&k.o==r.i){const dx=r.x-k.x,dy=r.y-k.y,d=Math.hypot(dx,dy);if(d<130&&d>1){const lo=Math.min(r.y,k.y),hi=Math.max(r.y,k.y);if(!L.gp.some(g=>g.y0>=lo&&g.y1<=hi)){const v=Math.min(d,320*dt);k.x+=dx/d*v;k.y+=dy/d*v}}}
if(r.q>0){r.qt-=dt;if(r.qt<=0){r.qt=.05;const g=L.gp[r.gi];if(g&&r.br[r.gi]<g.gb*U&&r.b>0){r.br[r.gi]+=U;r.b--;r.bl++;r.q--;snd('build');spark(LX(r.lane),g.y0+r.br[r.gi],'#ffe14d',4,60)}else r.q=0}}}
function pfx(X,Y){if(P.pm>0){const R=62+Math.sin(T*8)*6,g=c.createRadialGradient(X,Y-4,6,X,Y-4,R);g.addColorStop(0,'#ff4de066');g.addColorStop(1,'#ff4de000');c.fillStyle=g;c.beginPath();c.arc(X,Y-4,R,0,7);c.fill()}
if(P.ps>0){c.strokeStyle='#ffffffaa';c.lineWidth=2;for(let i=0;i<6;i++){const o=(T*320+i*53)%44,x=X-16+i*6.4;c.beginPath();c.moveTo(x,Y+14+o);c.lineTo(x,Y+30+o);c.stroke()}}
if(P.pk>0){c.fillStyle='#7fe4ff33';c.strokeStyle='#bff3ffcc';c.lineWidth=3;c.beginPath();c.arc(X,Y-4,25,0,7);c.fill();c.stroke()}}
function puHud(){const i=[];if(P.pm>0)i.push(`🧲 ${Math.ceil(P.pm)}s`);if(P.pd)i.push('<b style="color:#ffe14d">2×</b> BRICKS');if(P.ps>0)i.push(`💨 ${Math.ceil(P.ps)}s`);else if(P.pc>0)i.push(`<span style="opacity:.6">💨 ⏳${Math.ceil(P.pc)}s</span>`);if(P.pk>0)i.push(`🛡️ ${Math.ceil(P.pk)}s`);if(P.pb>0)i.push(`<span style="opacity:.6">🌉 ⏳${Math.ceil(P.pb)}s</span>`);
const h=i.map(x=>`<div class="pa">${x}</div>`).join('');if(h!=pas){pas=h;$('#pa').innerHTML=h}}
const pst=k=>k=='mag'?(P.pm>0?'ACTIVE':''):k=='dbl'?(P.pd?'ACTIVE':''):k=='spd'?(P.ps>0?'ACTIVE':P.pc>0?'⏳'+Math.ceil(P.pc)+'s':''):k=='shd'?(P.pk>0?'ACTIVE':''):(P.pb>0?'⏳'+Math.ceil(P.pb)+'s':'');
function puPanel(){if(st=='pu'){closePU();return}if(st!='run'){if(st=='count')toast('Wait for GO!');return}st='pu';puRender();$('#pup').classList.add('on');snd('click')}
function closePU(){if(st=='pu')st='run';$('#pup').classList.remove('on')}
function puRender(){const own=Object.entries(PUP).filter(([k])=>SV.pu[k]>0);
$('#pup').innerHTML=`<div class="pn"><div class="ph"><b>⚡ POWER-UPS</b><button class="x" onclick="closePU()">✕</button></div><div class="pl">${own.length?own.map(([k,u])=>{const z=pst(k);return`<div class="pr"><div class="ic">${u.e}</div><div class="tx"><b>${u.n}</b> <span class="qn">x${SV.pu[k]}</span><br>${u.d}</div><button class="btn g s" ${z?'disabled':''} onclick="usePU('${k}')">${z||(k=='dbl'?'EQUIP':'USE')}</button></div>`}).join(''):'<div class="pr">No power-ups yet! Buy packs in the Shop 🏪</div>'}</div></div>`}
function usePU(k){const r=P;if(st!='pu'||!(SV.pu[k]>0)||pst(k))return;
if(k=='mag')r.pm=10;else if(k=='dbl')r.pd=1;else if(k=='spd'){r.ps=5;r.pc=30}else if(k=='shd')r.pk=15;
else{const g=L.gp[r.gi];if(r.b<20)return toast('Need 20 bricks in your stack');if(!g||r.y<g.y0-120||r.br[r.gi]>=g.gb*U)return toast('Use it at a water gap');r.q=20;r.qt=0;r.pb=3}
SV.pu[k]--;SV.pa={pm:r.pm,pd:r.pd,ps:r.ps,pc:r.pc,pk:r.pk};save();snd('pu');closePU()}
const stabs=t=>`<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn s ${t=='c'?'g':''}" onclick="shop('c')">Characters</button><button class="btn s ${t=='b'?'g':''}" onclick="shop('b')">Bricks</button><button class="btn s ${t=='p'?'g':''}" onclick="shop('p')">⚡ Power-Ups</button></div>`;
function shopP(){scr(`<h2>SHOP 🪙 ${SV.coins}</h2>${stabs('p')}<div class="grid">${Object.entries(PUP).map(([k,u])=>{const q=SV.pu[k],add=Math.min(5,20-q);return`<div class="card" style="text-align:center"><div style="font-size:40px">${u.e}</div><b>${u.n}</b><br><small style="font-weight:400">${u.d}</small><br>Owned: ${q}/20<br><button class="btn s g" ${add?'':'disabled'} onclick="buyPU('${k}')">${add?`BUY +${add} · 🪙 ${Math.round(u.p*add/5)}`:'MAX'}</button></div>`}).join('')}</div><button class="btn" onclick="menu()">BACK</button>`)}
function buyPU(k){const u=PUP[k],add=Math.min(5,20-SV.pu[k]);if(!add)return;const cost=Math.round(u.p*add/5);if(SV.coins<cost){snd('minus');toast('Not enough coins 🪙');return}SV.coins-=cost;SV.pu[k]+=add;save();snd('coin');shopP()}
/* screens */
const scr=h=>{const s=$('#ui');s.innerHTML=h;s.className='scr on';s.scrollTop=0},hud=v=>{if(!v)$('#bb').style.display='none';$('#hud').style.display=v?'flex':'none';$('#joy').style.display=$('#dash').style.display=v?'block':'none'};
function menu(){snd('click');st='menu';hud(0);const c=CH.find(a=>a[0]==SV.eq.c),b=BR.find(a=>a[0]==SV.eq.b);
scr(`<h1>BRICK<br>BRIDGE<br>RACE</h1><div class="card">🪙 ${SV.coins} &nbsp;·&nbsp; ${c[4]} ${c[1]} &nbsp;·&nbsp; 🧱 ${b[1]}</div><button class="btn g" onclick="play(Math.min(SV.un,50))">▶ PLAY</button><button class="btn" onclick="levels()">LEVELS</button><button class="btn" onclick="shop('b')">SHOP</button><button class="btn" onclick="shop('c')">CHARACTERS</button><button class="btn" onclick="settings()">SETTINGS</button>`)}
function levels(){snd('click');scr(`<h2>LEVELS</h2><div class="grid g5">${Array.from({length:50},(_,i)=>{const k=i+1,lk=k>SV.un,bs=k%10==0;return`<button class="lv ${lk?'lk':''} ${bs?'bs':''}" ${lk?'':`onclick="play(${k})"`}>${lk?'🔒':bs?BS[k/10-1].e:k}<small>${SV.best[k]?SV.best[k].toFixed(1)+'s':'&nbsp;'}</small>${SV.sv[k]?'<span style="position:absolute;top:1px;right:3px;font-size:12px">⛈️</span>':''}</button>`}).join('')}</div><div class="card">Top 3 unlocks the next level · Beat every 10th level's boss to continue</div><button class="btn" onclick="menu()">BACK</button>`)}
function bossIntro(n){snd('lose');hud(0);st='menu';const b=BS[n/10-1],k=n/10,g=gen(n);
scr(`<div style="font-size:20px;font-weight:800;letter-spacing:3px;color:#ffe14d;text-shadow:0 3px 0 #0005">⚔️ BOSS BATTLE ⚔️</div><div style="font-size:110px;line-height:1.1;animation:bossbob .8s infinite alternate">${b.e}</div><h2>${b.n}</h2><div class="card" style="text-align:left;line-height:1.8;min-width:260px">Level ${n}<br>⚡ Speed: ${'★'.repeat(k)}${'☆'.repeat(5-k)}<br>🌉 ${g.gp.length} bridges · ${g.gp[0].gb} bricks each<br>🏁 Only you vs the boss!<br>🪙 Win reward: +${150*k} bonus</div><button class="btn g" onclick="play(${n},1)">⚔️ FIGHT!</button><button class="btn" onclick="levels()">BACK</button>`)}
function shop(tab){snd('click');if(tab=='p')return shopP();const list=tab=='c'?CH:BR;
scr(`<h2>SHOP 🪙 ${SV.coins}</h2>${stabs(tab)}<div class="grid">${list.map(a=>{const own=SV.own.includes(a[0]),on=SV.eq[tab]==a[0];return`<button class="card it ${on?'on':''}" onclick="buy('${tab}','${a[0]}')"><div class="pv" style="background:${tab=='c'?cfill(a[3],0.3):bfill(a[0],COL[0],2,.3)=='tvk'?TVKG:bfill(a[0],COL[0],2,.3)}">${tab=='c'?a[4]:''}</div>${a[1]}<br><small>${on?'✅ Equipped':own?'Tap to equip':'🔒 🪙 '+a[2]}</small></button>`}).join('')}</div><button class="btn" onclick="menu()">BACK</button>`)}
function buy(tab,id){const it=(tab=='c'?CH:BR).find(a=>a[0]==id);if(!SV.own.includes(id)){if(SV.coins<it[2]){snd('minus');return}SV.coins-=it[2];SV.own.push(id);snd('coin')}else snd('click');SV.eq[tab]=id;save();shop(tab)}
function settings(){snd('click');scr(`<h2>SETTINGS</h2><button class="btn" onclick="SV.snd=!SV.snd;save();settings()">🔊 Sound: ${SV.snd?'ON':'OFF'}</button><button class="btn" onclick="SV.mus=!SV.mus;save();music();settings()">🎵 Music: ${SV.mus?'ON':'OFF'}</button><button class="btn" onclick="editCtl()">🎮 Move Controls</button><button class="btn s" onclick="resetCtl()">↩ Reset Controls</button><div class="card">Joystick: move · 🚀 speed boost</div><button class="btn" onclick="menu()">BACK</button>`)}
function pause(){if(st!='run')return;st='pause';scr(`<h2>PAUSED</h2><button class="btn g" onclick="$('#ui').className='scr';st='run'">RESUME</button><button class="btn" onclick="play(L.n)">RESTART</button><button class="btn" onclick="settings2()">SOUND / MUSIC</button><button class="btn" onclick="menu()">MAIN MENU</button>`)}
function settings2(){SV.snd=!SV.snd;SV.mus=SV.snd;save();music();pause2()}function pause2(){st='run';pause()}
function results(){const rank=P.fin||L.R,w=rank<=3,time=P.fin?P.ft:T,n=L.n;
const co=[100,60,40,20,10][rank-1]+(L.boss&&w?150*L.boss.k:0)+(w?30:0)+(w&&time<45?20:0)+(P.coll>>1)+P.gates*3;
SV.coins+=co;SV.pa={};if(w&&n<50)SV.un=Math.max(SV.un,n+1);if(w&&(!SV.best[n]||time<SV.best[n]))SV.best[n]=time;save();
const T0=L.boss?(w?'👑 BOSS DEFEATED!':'💀 BOSS WINS'):['1ST PLACE 🏆','2ND PLACE 🥈','3RD PLACE 🥉','4TH PLACE','5TH PLACE'][rank-1];hud(0);st='menu';
scr(`<h2 style="font-size:34px;color:#ffe14d">${T0}</h2>${w&&n==50?'<div class="card">👑 CHAMPION OF ALL 50 LEVELS! 👑</div>':''}<div class="card" style="text-align:left;line-height:1.7">⏱ Race time: ${time.toFixed(1)}s<br>🧱 Bricks collected: ${P.coll}<br>🚪 Gates passed: ${P.gates}<br>🌉 Bridge length: ${P.bl} bricks<br>🪙 Coins earned: <b>+${co}</b></div>${w&&n<50?`<button class="btn g" onclick="play(${n+1})">NEXT LEVEL</button>`:''}<button class="btn" onclick="play(${n},1)">RETRY</button><button class="btn" onclick="shop('b')">SHOP</button><button class="btn" onclick="menu()">MAIN MENU</button>`);snd('coin')}
menu();
</script></body></html>
