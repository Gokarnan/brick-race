<html lang="en"><head><meta charset="utf-8">

<style>

<canvas id="cv"></canvas>
<div id="hud"><div class="pill">🧱 <span id="hb">0</span></div><div class="pill" id="hp">1/4</div><div class="pill" id="ht">0.0s</div><button class="btn s" onclick="pause()">⏸</button></div>

<div id="ui" class="scr"></div>
<script>
const $=s=>document.querySelector(s),W=360,H=640,U=24;
let SV={coins:0,un:1,own:['c0','b0'],eq:{c:'c0',b:'b0'},best:{},snd:1,mus:1};
try{Object.assign(SV,JSON.parse(localStorage.bbr))}catch(e){}
const save=()=>{try{localStorage.bbr=JSON.stringify(SV)}catch(e){}};
/* audio */
let AC,mi;const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,d,ty='triangle',v=.15,t0=0){try{const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}catch(e){}}
function snd(k){if(!SV.snd)return;({pick:()=>tone(880,.06),plus:()=>{tone(660,.08);tone(990,.12,'triangle',.15,.07)},minus:()=>{tone(300,.12,'sawtooth',.1);tone(200,.15,'sawtooth',.1,.08)},build:()=>tone(440+Math.random()*80,.05,'square',.05),coin:()=>{tone(988,.07);tone(1319,.12,'triangle',.15,.07)},click:()=>tone(600,.05),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.15,i*.12)),lose:()=>[400,330,260].forEach((f,i)=>tone(f,.25,'sawtooth',.1,i*.15))})[k]()}
function music(){clearInterval(mi);if(!SV.mus)return;const n=[523,587,659,784,880,784,659,587];let i=0;mi=setInterval(()=>{if(SV.mus)tone(n[i++%8]/2,.18,'sine',.04)},260)}
document.addEventListener('pointerdown',()=>{try{ac().resume();if(!mi)music()}catch(e){}});
/* data */
const CH=[['c0','Default',0,'#4aa8f0','🙂'],['c1','Ninja',150,'#2b2b3a','🥷'],['c2','Robot',200,'#9fb3c8','🤖'],['c3','Astronaut',250,'#f4f4f4','👨‍🚀'],['c4','King',300,'#ffb300','🤴'],['c5','Golden',400,'#ffd700','😎'],['c6','Rainbow',500,'rb','🥳'],['c7','Galaxy',600,'gx','👽']];
const BR=[['b0','Classic',0],['b1','Blue',80],['b2','Neon',150],['b3','Rainbow',250],['b4','Gold',300],['b5','Galaxy',400],['b6','Crystal',450]];
const COL=['#3b82f6','#ef4444','#22c55e','#eab308','#a855f7'],BE=['','😠','😛','🤪','😈'];
const LN=['Brick Basics','Plus Gates','Plus & Minus','Gate Choices','Wide Waters','Crab Patrol','Island Hops','Risky Gates','Turbo Bots','Championship'];
function bfill(id,col,i,t){switch(id){case'b1':return'#1d4ed8';case'b2':return'#39ff14';case'b3':return`hsl(${(i*47+t*120)%360},90%,55%)`;case'b4':return'#ffcf26';case'b5':return'#5b2fc4';case'b6':return'#a5f3ff'}return col}
const cfill=(c,t)=>c=='rb'?`hsl(${t*200%360},90%,60%)`:c=='gx'?'#4b2a8a':c;
/* level generation */
function gen(n){let s=n*7919;const rnd=()=>(s=(s*16807+11)%2147483647)/2147483647;
const R=n==10?5:4,ng=n>=9?5:n>=5?4:3,gb=25+Math.round((n-1)*11/9);
const L={n,R,pl:[],gp:[],bk:[],ga:[],ob:[],dc:[]};let y=0,id=0;
for(let k=0;k<=ng;k++){const len=k==ng?240:k?460:500,p={y0:y,y1:y+len};L.pl.push(p);y+=len;
 for(let d=p.y0+40;d<p.y1;d+=110)L.dc.push({x:rnd()<.5?14:346,y:d,e:'🌴'});
 if(k==ng)break;
 const per=Math.round(gb*(n<2?1.3:n<5?.9:.75))+3;
 for(let o=0;o<R;o++)for(let j=0;j<per;j++)L.bk.push({x:50+rnd()*260,y:p.y0+40+rnd()*(len-90),o});
 const rc=n<2?0:Math.min(3,1+(n>>2)),gc=n<4?2:3,w=288/gc,P=[5,10,15,20,25],M=[3,5,8,10,15];
 for(let j=0;j<rc;j++){const ry=p.y0+110+(j+.5)*((len-190)/rc),list=[],lim=Math.min(5,1+(n>>1)),pp=n>=8?.45:.6,fp=n<4?99:(rnd()*gc|0);
  for(let q=0;q<gc;q++){let v;if(n<3||q==fp&&n>=4||(n==3&&q==0))v=P[rnd()*lim|0];else v=rnd()<pp?P[rnd()*lim|0]:-M[Math.min(4,(rnd()*(lim+(n>=8?1:0)))|0)];if(n==3&&q==1)v=-M[rnd()*3|0];list.push({x:36+q*w+w/2,w:w-8,v})}
  if(n>=3&&rnd()<.22){const q=n==3?1:(rnd()*gc|0);if(q!=fp){const k=rnd()<.6?'x':'d';list[q].k=k;list[q].v=k=='x'?[2,3,4][Math.min(2,(rnd()*(n>>1))|0)]:[2,2,3][rnd()*3|0]}}
  L.ga.push({id:id++,y:ry,pi:k,list})}
 if(n>=6)for(let j=0;j<Math.min(3,n-5);j++)L.ob.push({y:p.y0+120+rnd()*(len-200),sp:1+rnd(),ph:rnd()*6,amp:90+rnd()*40});
 const g={y0:y,y1:y+gb*U,gb};L.gp.push(g);y=g.y1;L.dc.push({x:rnd()<.5?14:346,y:(g.y0+g.y1)/2,e:'🏝️'})}
L.fy=L.pl[ng].y0+110;return L}
const gv=(q,b)=>q.k=='x'?b*q.v:q.k=='d'?Math.floor(b/q.v):b+q.v,gl=q=>q.k=='x'?'×'+q.v:q.k=='d'?'÷'+q.v:(q.v>0?'+':'−')+Math.abs(q.v),gcol=q=>q.k=='x'?'#f59e0b':q.k=='d'?'#be123c':q.v>0?'#22c55e':'#ef4444';
const LX=l=>180+(l-(L.R-1)/2)*54;
/* state */
let L,RS,P,T=0,st='menu',cam=0,cd=0,fin=0,fls=[],pts=[],jv={x:0,y:0},kx=0,ky=0,last=0;
const cv=$('#cv'),c=cv.getContext('2d');cv.width=W;cv.height=H;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}addEventListener('resize',fit);fit();
const sy=y=>470-(y-cam);
function play(n){snd('click');L=gen(n);RS=[];fin=0;T=0;fls=[];pts=[];
for(let i=0;i<L.R;i++){const lane=i==0?1:i==1?0:i;RS.push({i,P:!i,lane,x:LX(lane),y:30,b:0,br:L.gp.map(()=>0),used:{},gi:0,mode:'g',batch:6+(Math.random()*3|0),cd:0,hit:0,dash:0,dcd:0,coll:0,gates:0,bl:0,fin:0,ft:0,t:Math.random()*9,tu:0,mv:0,spd:i?92+n*.3+Math.random()*4:118})}
P=RS[0];cam=30;cd=2.4;st='count';$('#ui').className='scr';$('#hud').style.display='flex';$('#joy').style.display=$('#dash').style.display='block';applyCtl()}
const gapAt=y=>L.gp.findIndex(g=>y>g.y0-8&&y<g.y1);
const dir=(r,x,y)=>{const dx=x-r.x,dy=y-r.y,d=Math.hypot(dx,dy);return d<4?[0,0]:[dx/d,dy/d]};
function nb(r,pl){let b=null,bd=1e9;for(const k of L.bk)if(!k.d&&k.o==r.i&&k.y>pl.y0&&k.y<pl.y1){const d=(k.x-r.x)**2+(k.y-r.y)**2;if(d<bd){bd=d;b=k}}return b}
function ai(r){const gp=L.gp[r.gi];if(!gp)return[Math.max(-1,Math.min(1,(LX(r.lane)-r.x)/30)),1];
const full=gp.gb*U,need=Math.ceil((full-r.br[r.gi])/U);
if(r.b==0&&r.br[r.gi]<full&&r.y>gp.y0-14&&r.mode!='g'){r.mode='g';r.batch=6+(Math.random()*3|0)}
if(r.mode=='g'){if(r.y>gp.y0-10)return[0,-1];const k=nb(r,L.pl[r.gi]);if(r.b>=Math.min(need,r.batch)||!k){r.mode='go';return[0,0]}return dir(r,k.x,k.y)}
const rows=L.ga.filter(g=>g.pi==r.gi&&!r.used[g.id]&&g.y>r.y-8);
if(rows.length){const row=rows[0];let best=null,bs=-1e9;for(const g of row.list){const e=gv(g,Math.max(r.b,8))-Math.max(r.b,8),s=e+(e>0?15:0)+Math.sin(r.i*7+row.id*3)*14*(1-Math.min(1,r.spd/130));if(s>bs){bs=s;best=g}}return dir(r,best.x,row.y+16)}
return[Math.max(-1,Math.min(1,(LX(r.lane)-r.x)/30)),1]}
function topup(r){const gp=L.gp[r.gi];if(!gp)return;const need=Math.ceil((gp.gb*U-r.br[r.gi])/U),pl=L.pl[r.gi];if(r.b>=need||L.bk.some(k=>!k.d&&k.o==r.i&&k.y>pl.y0&&k.y<pl.y1))return;for(let j=0;j<Math.min(need-r.b,8);j++)L.bk.push({x:50+Math.random()*260,y:pl.y0+40+Math.random()*(pl.y1-pl.y0-90),o:r.i})}
function spark(x,y,col,n=4,v=60){for(let i=0;i<n;i++)pts.push({x,y,vx:(Math.random()-.5)*v*2,vy:Math.random()*v+20,t:0,col,g:-200})}
function ftxt(r,v,tx){fls.push({x:r.x,y:r.y+20,t:0,txt:tx||(v>0?'+':'−')+Math.abs(v),col:v>0?'#7dff6b':'#ff6b6b'})}
function step(r,dt){if(r.fin)return;let ix=0,iy=0;if(r.P){ix=jv.x||kx;iy=jv.y||ky}else[ix,iy]=ai(r);
const mv=Math.hypot(ix,iy);if(mv>1){ix/=mv;iy/=mv}r.mv=mv>.1;r.hit-=dt;r.cd-=dt;r.dash-=dt;r.dcd-=dt;r.tu-=dt;
const sp=r.spd*(r.dash>0?1.7:1)*(r.hit>0?.65:1);let nx=r.x+ix*sp*dt,ny=Math.max(0,r.y+iy*sp*dt);
const gi=gapAt(ny);
if(gi>=0){const g=L.gp[gi];nx+=(LX(r.lane)-nx)*Math.min(1,dt*12);
 if(iy>.1&&r.b>0&&r.cd<=0&&r.br[gi]<g.gb*U&&ny>=g.y0+r.br[gi]-4){r.br[gi]+=U;r.b--;r.bl++;r.cd=.09;if(r.P)snd('build');spark(LX(r.lane),g.y0+r.br[gi],COL[r.i],3,40)}
 if(ny>g.y0)ny=Math.min(ny,g.y0+r.br[gi])}else nx=Math.max(42,Math.min(318,nx));
r.x=nx;r.y=ny;if(r.mv)r.t+=dt;while(L.gp[r.gi]&&r.y>L.gp[r.gi].y1)r.gi++;
if(r.tu<=0){r.tu=1.2;topup(r)}
for(const k of L.bk)if(!k.d&&k.o==r.i&&Math.abs(k.x-r.x)<17&&Math.abs(k.y-r.y)<17){k.d=1;r.b++;r.coll++;if(r.P){snd('pick');spark(k.x,k.y,'#fff',4)}}
for(const g of L.ga)if(!r.used[g.id]&&r.y>=g.y&&r.y<g.y+40){r.used[g.id]=1;const q=g.list.find(a=>Math.abs(r.x-a.x)<a.w/2);if(q){r.gates++;const nb2=Math.max(0,Math.min(400,gv(q,r.b))),dl=nb2-r.b;r.b=nb2;ftxt(r,dl,gl(q));if(r.P){snd(dl>=0?'plus':'minus');spark(r.x,r.y,dl>=0?'#7dff6b':'#ff6b6b',10)}}}
if(r.hit<=0)for(const o of L.ob){const ox=180+Math.sin(T*o.sp+o.ph)*o.amp;if(Math.abs(ox-r.x)<17&&Math.abs(o.y-r.y)<15){r.hit=1;const l=Math.min(3,r.b);r.b-=l;if(l)ftxt(r,-l);if(r.P)snd('minus')}}
if(r.y>=L.fy&&!r.fin){r.fin=++fin;r.ft=T;if(r.P||(fin>=L.R-1&&!P.fin))endRace()}}
function endRace(){if(st!='run')return;st='end';const w=P.fin&&P.fin<=3;snd(w?'win':'lose');if(w)for(let i=0;i<60;i++)pts.push({x:P.x+(Math.random()-.5)*200,y:P.y+150,vx:(Math.random()-.5)*80,vy:Math.random()*200,t:0,col:`hsl(${Math.random()*360},90%,60%)`,g:-260});setTimeout(results,1500)}
/* draw */
let WG;
function draw(){if(!WG){WG=c.createLinearGradient(0,0,0,H);WG.addColorStop(0,'#52d8ff');WG.addColorStop(1,'#1b8ee8')}
c.fillStyle=WG;c.fillRect(0,0,W,H);c.strokeStyle='#ffffff66';c.lineWidth=2;
for(let k=0;k<10;k++){const yy=((k*72+T*10-cam*.5)%720+720)%720-40;c.beginPath();for(let xx=0;xx<=W;xx+=30){const v=yy+Math.sin(xx/30+T*2+k)*4;xx?c.lineTo(xx,v):c.moveTo(xx,v)}c.stroke()}
c.textAlign='center';c.font='34px serif';for(const d of L.dc){const Y=sy(d.y);if(Y>-30&&Y<H+30)c.fillText(d.e,d.x,Y+10)}
for(const p of L.pl){const a=sy(p.y1),b=sy(p.y0);if(b<-20||a>H+20)continue;c.fillStyle='#d49a30';c.fillRect(34,a,292,b-a+12);c.fillStyle='#ffe08a';c.fillRect(34,a,292,b-a);c.fillStyle='#fff3b8';c.fillRect(34,a,292,4)}
L.gp.forEach((g,gi)=>{const a=sy(g.y1),b=sy(g.y0);if(b<-30||a>H+30)return;c.fillStyle='#0a4fa028';RS.forEach(r=>c.fillRect(LX(r.lane)-23,a,46,b-a));
 RS.forEach(r=>{const n=r.br[gi]/U;for(let k=0;k<n;k++){const yy=sy(g.y0+(k+1)*U),X=LX(r.lane)-22;c.fillStyle=r.P?bfill(SV.eq.b,COL[0],k,T):COL[r.i];c.fillRect(X,yy+1,44,U-2);c.fillStyle='#fff6';c.fillRect(X,yy+1,44,4)}})});
const fY=sy(L.fy);if(fY>-40&&fY<H+40){for(let k=0;k<18;k++)for(let j=0;j<2;j++){c.fillStyle=(k+j)%2?'#222':'#fff';c.fillRect(36+k*16,fY+j*8-8,16,8)}c.fillStyle='#eee';c.fillRect(30,fY-70,8,70);c.fillRect(322,fY-70,8,70);c.fillStyle='#e11d48';c.fillRect(30,fY-84,300,26);c.fillStyle='#fff';c.font='800 20px sans-serif';c.fillText('🏁 FINISH 🏁',180,fY-65)}
for(const k of L.bk){if(k.d)continue;const Y=sy(k.y);if(Y<-10||Y>H+10)continue;c.fillStyle='#0003';c.fillRect(k.x-9,Y-2,18,9);c.fillStyle=k.o?COL[k.o]:bfill(SV.eq.b,COL[0],k.x,T);c.fillRect(k.x-9,Y-6,18,11);c.fillStyle='#fff7';c.fillRect(k.x-9,Y-6,18,3)}
for(const g of L.ga){const Y=sy(g.y);if(Y<-50||Y>H+50)continue;for(const q of g.list){const col=gcol(q);c.fillStyle=col+'44';c.fillRect(q.x-q.w/2,Y-4,q.w,8);c.fillStyle='#fff';c.fillRect(q.x-q.w/2-3,Y-40,6,44);c.fillRect(q.x+q.w/2-3,Y-40,6,44);c.fillStyle='#0003';c.fillRect(q.x-q.w/2,Y-34,q.w,32);c.fillStyle=col;c.fillRect(q.x-q.w/2,Y-40,q.w,32);c.fillStyle='#fff4';c.fillRect(q.x-q.w/2,Y-40,q.w,6);c.fillStyle='#fff';c.font='800 24px sans-serif';c.fillText(gl(q),q.x,Y-16)}}
c.font='30px serif';for(const o of L.ob){const Y=sy(o.y);if(Y>-30&&Y<H+30)c.fillText('🦀',180+Math.sin(T*o.sp+o.ph)*o.amp,Y+10)}
[...RS].sort((a,b)=>b.y-a.y).forEach(r=>{const X=r.x,Y=sy(r.y);if(Y<-50||Y>H+260)return;const bob=r.fin?Math.abs(Math.sin(T*10))*8:r.mv?Math.abs(Math.sin(r.t*9))*3:0;
 const n=Math.min(r.b,26);for(let i=0;i<n;i++){const yy=Y+12+i*6,xo=X-10+(r.mv?Math.sin(T*6+i*.6)*2:0);c.fillStyle=r.P?bfill(SV.eq.b,COL[0],i,T):COL[r.i];c.fillRect(xo,yy,20,5.5);c.fillStyle='#fff5';c.fillRect(xo,yy,20,1.5)}
 c.fillStyle='#0003';c.beginPath();c.ellipse(X,Y+10,13,5,0,0,7);c.fill();
 c.fillStyle=r.P?cfill(CH.find(a=>a[0]==SV.eq.c)[3],T):COL[r.i];c.beginPath();c.arc(X,Y-4-bob,13,0,7);c.fill();c.strokeStyle='#0004';c.lineWidth=2;c.stroke();

for(const k in CT){const el=CT[k];let on=0,ox=0,oy=0;el.addEventListener('pointerdown',e=>{if(!ed)return;on=1;el.setPointerCapture(e.pointerId);const b=el.getBoundingClientRect();ox=e.clientX-b.left;oy=e.clientY-b.top});
el.addEventListener('pointermove',e=>{if(!ed||!on)return;const x=Math.max(0,Math.min(innerWidth-el.offsetWidth,e.clientX-ox)),y=Math.max(0,Math.min(innerHeight-el.offsetHeight,e.clientY-oy));el.style.left=x+'px';el.style.top=y+'px';el.style.bottom=el.style.right='auto';SV.ctl=SV.ctl||{};SV.ctl[k]=[x/innerWidth,y/innerHeight]});
